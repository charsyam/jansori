[package]
name = "jansori"
version = "0.1.0"
edition = "2021"
description = "A lightweight database query performance dashboard"
license = "MIT"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["mysql", "postgres", "json", "runtime-tokio", "tls-rustls-ring"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
sha2 = "0.10"
